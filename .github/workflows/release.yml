name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package plugin
        run: |
          mkdir obsidian-reader
          cp main.js manifest.json styles.css obsidian-reader/
          zip -r "obsidian-reader-${GITHUB_REF_NAME}.zip" obsidian-reader

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: obsidian-reader-${{ github.ref_name }}.zip
          generate_release_notes: true
